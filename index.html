* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 40; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.l1 { --lv: var(--l1); --lv-soft: var(--l1-soft); }
.l2 { --lv: var(--l2); --lv-soft: var(--l2-soft); }
.l3 { --lv: var(--l3); --lv-soft: var(--l3-soft); }

/* barra in alto */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { flex-wrap: wrap; max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); min-width: 0; }
.mark { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mark .sym-svg { height: 32px !important; }
.brand-t { display: block; font-family: var(--f-display); font-size: 20px; line-height: 1.1; font-weight: 500; letter-spacing: -.01em; }
.brand-t strong { font-weight: 800; }
.brand-t small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.top-r { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; min-height: 34px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.btn { font: inherit; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent); border-radius: 10px; padding: 9px 16px; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.idx-btn { display: none; }

/* struttura */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 36px; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { min-width: 0; outline: none; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.n-home { display: block; font-weight: 700; text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 10px; }
.n-home.cur, .n-home:hover { background: var(--accent-soft); }
.n-lv { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--lv); padding: 0 12px 6px; }
.n-lv .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lv); }
.n-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.n-list a { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); padding: 7px 12px; border-radius: 10px; font-size: 15px; line-height: 1.35; }
.n-list a:hover { background: var(--lv-soft); }
.n-list a.cur { background: var(--lv-soft); font-weight: 800; }
.n-no { flex: none; width: 22px; font-family: var(--f-display); font-weight: 800; color: var(--lv); }
.n-t { flex: 1; min-width: 0; }
.n-ok { color: var(--ok); font-weight: 800; }
.n-add { align-self: stretch; }

/* home */
.hero { position: relative; padding: 8px 0 38px; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 5rem); font-weight: 800; letter-spacing: -.03em; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 40em; margin-top: 14px; }
.hero-staff { position: absolute; right: 0; top: 10px; width: min(34%, 300px); display: flex; flex-direction: column; gap: 14px; opacity: .55; pointer-events: none; }
.hero-staff span { height: 2px; background: var(--staff); border-radius: 2px; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.lv { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.lv header { margin-bottom: 14px; }
.lv-cl { display: inline-block; background: var(--lv-soft); color: var(--lv); font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
.lv h2 { font-size: 1.35rem; margin: 10px 0 4px; }
.lv header p { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.lv ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lv ol a { display: flex; align-items: baseline; gap: 10px; padding: 10px 6px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); line-height: 1.35; }
.lv ol a:hover { background: var(--lv-soft); }
.lv-no { flex: none; width: 24px; font-family: var(--f-display); font-weight: 800; color: var(--lv); }
.lv-t { flex: 1; min-width: 0; font-weight: 600; }
.lv-s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: block; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lv, var(--accent)); border-radius: 99px; }
.howto { margin-top: 34px; }
.howto h2 { font-size: 1.4rem; margin-bottom: 14px; }
.howto ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; counter-reset: s; }
.howto li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.howto li strong { font-family: var(--f-display); font-size: 1.1rem; }
.howto li span { color: var(--muted); font-size: 15px; }

/* capitolo */
.ch-h { margin-bottom: 22px; }
.chip { color: var(--lv, var(--accent)); }
.ch-h h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 16px; }
.ch-no { flex: none; display: grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: var(--lv, var(--accent)); color: var(--accent-ink); font-size: .8em; }
.obj { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
.obj ul { margin: 6px 0 0; padding-left: 1.2em; }
.obj li { margin: 2px 0; }
.ch-prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--muted); }
.ch-prog .bar { width: 160px; flex: none; }
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tab { font: inherit; font-weight: 800; background: none; border: 0; color: var(--muted); padding: 12px 18px; cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; min-height: 48px; }
.tab small { display: inline-block; background: var(--line); color: var(--ink); border-radius: 99px; padding: 0 8px; font-size: 12px; margin-left: 4px; }
.tab.on { color: var(--ink); border-bottom-color: var(--lv, var(--accent)); }
.panel { max-width: 46rem; }
.blk { margin-bottom: 30px; }
.blk h3 { font-size: 1.5rem; margin-bottom: 10px; }
.blk ul { padding-left: 1.2em; margin: 0 0 .8em; }
.blk li { margin: 4px 0; }
.fig { margin: 14px 0 6px; padding: 14px 18px 10px; background: var(--fig); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.fig figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.stf { display: block; color: var(--ink); }
.stf .sl, .stf .lg { fill: var(--staff); }
.stf .hole { fill: var(--fig); }
.stf .tie { fill: currentColor; }
.stf .ts { font-family: var(--f-display); font-weight: 800; fill: currentColor; }
.tbl-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { background: var(--accent-soft); font-weight: 800; }
tbody th { font-weight: 700; }
tbody tr:last-child > * { border-bottom: 0; }
.syms { list-style: none; padding: 0 !important; display: grid; gap: 10px; margin: 14px 0; }
.syms li { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; margin: 0; }
.syms .sym-svg { flex: none; color: var(--ink); min-width: 28px; }
.kb { margin: 14px 0; background: var(--fig); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kb svg { display: block; width: 100%; max-width: 560px; }
.kb figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.k-white { fill: var(--surface); stroke: var(--staff); stroke-width: 3; }
.k-semi { fill: var(--mark); stroke: var(--staff); stroke-width: 3; }
.k-black { fill: var(--ink); }
.k-lab { font: 800 34px var(--f-display); fill: var(--ink); }
.k-semi + .k-lab { fill: var(--mark-ink); }
.k-note { font: 800 30px var(--f-body); fill: var(--ink); }
.remember { background: var(--mark); color: var(--mark-ink); border-radius: 14px; padding: 18px 22px; margin: 8px 0 26px; }
.remember h3 { font-size: 1.2rem; margin-bottom: 8px; }
.remember ul { margin: 0; padding-left: 1.2em; }
.remember li { margin: 4px 0; font-weight: 600; }
.tnote { border: 2px dashed var(--line); border-radius: 14px; padding: 16px 20px; }
.tnote h3 { font-size: 1.1rem; margin-bottom: 8px; }
.ex-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.ex-h h2 { font-size: 1.6rem; }
.ex-h p { color: var(--muted); margin: 4px 0 0; }
.ex-dl { display: flex; gap: 10px; flex-wrap: wrap; }
.ex { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.ex-n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.ex-b { flex: 1; min-width: 0; }
.ex-q p { margin: 0 0 6px; font-weight: 600; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { font: inherit; text-align: left; display: flex; gap: 12px; align-items: center; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--ink); cursor: pointer; min-height: 48px; }
.opt:hover { border-color: var(--accent); }
.opt-l { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.key { border-color: var(--ok); border-style: dashed; }
.fb { min-height: 1.6em; margin: 10px 0 0; font-size: 15px; }
.fb.ok { color: var(--ok); }
.fb.no { color: var(--bad); font-weight: 700; }
.ans { width: 100%; margin-top: 10px; font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }
.chk { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 32px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.sol { margin-top: 12px; border-radius: 12px; background: var(--ok-soft); padding: 8px 14px; }
.sol summary { cursor: pointer; font-weight: 800; color: var(--ok); min-height: 32px; display: flex; align-items: center; }
.sol p { margin: 6px 0; }
.t-bar { margin: 22px 0 0; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 34px; max-width: 46rem; }
.pn a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; text-decoration: none; color: var(--ink); font-weight: 800; font-family: var(--f-display); }
.pn a small { display: block; font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pn a:hover { border-color: var(--accent); }
.pn .nx { text-align: right; }
.empty { color: var(--muted); }

/* glossario */
.srch { display: block; max-width: 36rem; margin-bottom: 18px; }
.srch input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; }
.gl { max-width: 46rem; margin: 0; display: grid; gap: 10px; }
.gl > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.gl dt { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.gl dd { margin: 2px 0 0; color: var(--muted); }

/* editor docente */
.ed-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); z-index: 20; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--bg); padding: 10px 0; margin-bottom: 8px; }
.ed-msg { font-size: 14px; color: var(--muted); }
.ed { max-width: 46rem; display: grid; gap: 14px; }
.ed-h { font-size: 1.4rem; margin-top: 18px; }
.fld { display: grid; gap: 4px; }
.fld > span { font-size: 13px; font-weight: 800; color: var(--muted); }
.fld input, .fld textarea, .fld select { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-height: 44px; }
.ed-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.ed-card-h { display: flex; justify-content: space-between; align-items: center; }
.ed-card-h span { display: flex; gap: 6px; }
.mini { font: inherit; font-size: 14px; font-weight: 800; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; min-height: 36px; min-width: 36px; }
.mini.bad { color: var(--bad); }
.ed-prev:empty { display: none; }
.ed-prev { overflow-x: auto; }
.ed-danger { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; z-index: 50; max-width: min(92vw, 440px); text-align: center; }
.boot-err, .loading { padding: 60px 16px; text-align: center; color: var(--muted); }
.loading { font-family: var(--f-display); font-size: 1.4rem; }

@media (max-width: 940px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side { display: none; position: static; max-height: none; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  body.idx-open .side { display: flex; }
  .idx-btn { display: inline-block; }
  .hero-staff { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .top-r:has(.seg) { width: 100%; justify-content: space-between; }
  .brand-t { font-size: 17px; }
  .mark { width: 38px; height: 38px; }
  .ex { flex-direction: column; gap: 10px; padding: 14px; }
  .pn { grid-template-columns: 1fr; }
  .pn .nx { text-align: left; }
  .ch-h h1 { gap: 12px; }
  .ch-prog .bar { width: 110px; }
  .btn { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

.pir { margin: 14px 0; background: var(--fig); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; }
.pir-r { display: grid; grid-template-columns: minmax(96px, 124px) 1fr minmax(38px, auto); align-items: center; gap: 10px; }
.pir-n { font-weight: 700; font-size: 13px; color: var(--ink); }
.pir-v { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.pir-b { height: 22px; border-radius: 4px; opacity: var(--o, 1); background: repeating-linear-gradient(90deg, var(--accent) 0, var(--accent) calc(100% / var(--n) - var(--g)), transparent calc(100% / var(--n) - var(--g)), transparent calc(100% / var(--n))); }
.pir figcaption, .cq figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
.cq { margin: 14px 0; background: var(--fig); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.cq svg { display: block; width: 100%; max-width: 460px; margin: 0 auto; }
.cq-r1, .cq-r2, .cq-r3 { fill: none; stroke: var(--line); stroke-width: 1.5; }
.cq-M { font: 800 17px var(--f-display); fill: var(--ink); }
.cq-m { font: 700 13px var(--f-body); fill: var(--accent); }
.cq-a { font: 700 12px var(--f-body); fill: var(--muted); }
.cq-c { font: 600 11px var(--f-body); fill: var(--muted); }
@media (max-width: 520px) { .pir-r { grid-template-columns: 94px 1fr 36px; gap: 6px; } .pir-n { font-size: 12px; } .cq-M { font-size: 15px; } }

.clefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:12px 0}
.cl{margin:0;text-align:center;background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:8px 6px}
.cl svg{width:100%;max-width:110px;height:auto;color:inherit}.cl .sl{fill:currentColor;opacity:.75}
.cl figcaption{font-size:.82rem;line-height:1.3;margin-top:4px}.cl small{opacity:.75}
.evo{margin:12px 0;display:grid;gap:10px}.evo-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ev-c,.ev-r{margin:0;background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.ev-c{display:grid;justify-items:center;gap:4px}.ev-l{font:700 3rem Georgia,serif;line-height:1}.ev-arr{font-size:1.4rem;opacity:.6}
.ev-c figcaption,.ev-r figcaption{font-size:.88rem;margin-bottom:6px}.ev-r{text-align:left}.ev-r svg{width:100%;max-width:560px;height:auto;display:block}
.ev-r .stf{max-width:100%}.ev-t{font:700 30px Georgia,serif}.ev-s{font:600 22px Nunito,sans-serif}
.play{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}.play span{font-size:.82rem;opacity:.7}
.btn-play{font:700 1rem inherit;border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer}
.btn-play.on{background:var(--ink)}.btn-play:focus-visible{outline:3px solid #3B4BDB;outline-offset:2px}
.cl .refn{fill:var(--accent)}
.imgf img{display:block;width:100%;height:auto;background:#fff;border-radius:8px}
.aud{margin:12px 0;padding:12px 14px;background:var(--fig);border:1px solid var(--line);border-radius:12px}.aud-t{font-weight:700;margin-bottom:8px}.aud audio{width:100%}

/* Accesso, gestione utenze e progressi */
.top-r { flex-wrap: wrap; justify-content: flex-end; }
.who { display: grid; line-height: 1.2; text-align: right; min-width: 0; }
.who strong { font-size: 14px; }
.who small { font-size: 12px; color: var(--muted); font-weight: 700; }
.btn.sm { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.btn.wa { background: #1F9D55; border-color: #1F9D55; color: #fff; }
.n-sep { margin: 18px 12px 4px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead.sm { font-size: 1rem; margin-top: 8px; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: min(100%, 440px); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; display: grid; gap: 14px; }
.gate-card h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; margin-top: 6px; }
.gate-card form { display: grid; gap: 14px; }
.brand.big { margin-bottom: 4px; }

/* ===== Teoria Musicale Kids: animazioni e lavagna ===== */
.board-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 22px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
.board-bar span { color: var(--muted); font-size: .92rem; flex: 1 1 220px; }
.kd { margin: 18px 0 8px; padding: 18px; border-radius: 22px; background: var(--surface); border: 2px solid var(--line); text-align: center; --k1: #E5484D; --k2: #F2872F; --k3: #2F9E50; --k4: #4B5BD6; }
.kd * { min-width: 0; }
.kd-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 14px 0 4px; }
.kd-hint { margin: 10px 0 0; color: var(--muted); font-size: .95rem; }
.kd-big { font-size: 3rem; line-height: 1; display: block; }
.kd-btn { font: inherit; font-weight: 800; font-size: 1.1rem; padding: 12px 20px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; min-height: 52px; transition: transform .12s; }
.kd-btn:hover { transform: translateY(-2px); }
.kd-btn:active { transform: scale(.96); }
.kd-btn.main, .kd-btn.on { background: var(--accent); color: var(--accent-ink); }
.kd-card { font: inherit; color: var(--ink); display: grid; gap: 4px; justify-items: center; padding: 16px 20px; min-width: 150px; border-radius: 20px; border: 2px solid var(--line); background: var(--fig); cursor: pointer; transition: transform .12s, border-color .12s; }
.kd-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.kd-card small { color: var(--muted); }
.kd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
@keyframes kd-pop { 0% { transform: scale(1); } 35% { transform: scale(1.18) rotate(-3deg); } 100% { transform: scale(1); } }
.pop { animation: kd-pop .45s ease; }
/* corda */
.kd-vib svg { width: 100%; max-width: 380px; height: auto; overflow: visible; }
.kd-peg { fill: var(--muted); }
.kd-str { fill: var(--k2); transform-box: fill-box; transform-origin: center; }
.kd-waves circle { fill: none; stroke: var(--k4); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
@keyframes kd-str { from { transform: scaleY(1); } to { transform: scaleY(14); } }
@keyframes kd-wave { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(4.2); opacity: 0; } }
.kd-vib.on .kd-str { animation: kd-str .07s linear infinite alternate; }
.kd-vib.on .kd-waves circle { animation: kd-wave 1.4s ease-out infinite; }
.kd-vib.on .kd-waves circle:nth-child(2) { animation-delay: .45s; }
.kd-vib.on .kd-waves circle:nth-child(3) { animation-delay: .9s; }
/* scale */
.kd-stairs { position: relative; display: flex; align-items: flex-end; height: 200px; margin: 18px auto 6px; max-width: 520px; border-bottom: 4px solid var(--line); }
.kd-step { flex: 1; height: var(--h); background: var(--c); border-radius: 10px 10px 0 0; display: grid; align-items: end; justify-items: center; padding-bottom: 6px; color: #fff; font-weight: 800; font-size: .95rem; }
.kd-ball { position: absolute; left: calc(var(--i) * 12.5% + 1%); bottom: calc(40px + var(--i) * 20px); font-size: 2.2rem; line-height: 1; transition: left .35s ease, bottom .35s ease; }
/* durata */
.kd-durrow { display: grid; grid-template-columns: minmax(110px, 140px) 1fr auto; align-items: center; gap: 12px; margin: 12px 0; text-align: left; }
.kd-lab { display: grid; justify-items: center; }
.kd-bar { height: 22px; border-radius: 999px; background: var(--line); overflow: hidden; min-width: 80px; }
.kd-bar i { display: block; width: 0; height: 100%; background: var(--k3); border-radius: 999px; }
/* forte e piano */
.kd-spk-w { height: 110px; display: grid; place-items: center; }
.kd-spk { font-size: 4rem; display: block; transform: scale(var(--amp)); transition: transform .3s; }
.kd-meter { height: 20px; max-width: 360px; margin: 6px auto; border-radius: 999px; background: var(--line); overflow: hidden; }
.kd-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--k3), var(--k2), var(--k1)); border-radius: 999px; transition: width .35s; }
/* battito */
.kd-heart-w { height: 110px; display: grid; place-items: center; }
.kd-heart { font-size: 4rem; display: block; }
@keyframes kd-beat { 0% { transform: scale(1); } 30% { transform: scale(1.4); } 100% { transform: scale(1); } }
.kd-heart.pop { animation: kd-beat .3s ease; }
.kd-dots { display: flex; gap: 10px; justify-content: center; }
.kd-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
.kd-dots i.lit { background: var(--k1); }
/* figure */
.kd-figrow { display: grid; grid-template-columns: minmax(180px, 1.1fr) 2fr; gap: 12px; align-items: center; margin: 10px 0; text-align: left; }
.kd-fn { font: inherit; color: var(--ink); display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--fig); cursor: pointer; text-align: left; }
.kd-fn:hover { border-color: var(--accent); }
.kd-fn span { display: grid; }
.kd-fn small { color: var(--muted); }
.kd-ns { width: 34px; height: 52px; flex: none; }
.kd-cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kd-cells i { font-style: normal; font-weight: 800; text-align: center; padding: 14px 0; border-radius: 12px; background: var(--line); color: var(--muted); transition: background .2s; }
.kd-cells i.lit { background: var(--k3); color: #fff; }
.kd-cells i.half { background: linear-gradient(90deg, var(--k3) 50%, var(--line) 50%); color: var(--ink); }
/* pausa */
.kd-slots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.kd-slot { display: grid; justify-items: center; gap: 2px; padding: 14px 20px; min-width: 110px; border-radius: 18px; border: 3px solid var(--line); background: var(--fig); opacity: .75; transition: transform .2s, opacity .2s, border-color .2s; }
.kd-slot span { font-size: 2.6rem; line-height: 1; }
.kd-slot.n { border-color: var(--k3); }
.kd-slot.r { border-color: var(--k4); border-style: dashed; }
.kd-slot.lit { opacity: 1; transform: scale(1.12); background: var(--accent-soft); }
/* battute */
.kd-bars { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 8px; }
.kd-bar4 { display: flex; gap: 6px; }
.kd-barline { width: 6px; background: var(--ink); border-radius: 3px; }
.kd-beat { width: 64px; height: 76px; display: grid; place-items: center; border-radius: 14px; background: var(--line); font-size: 1.8rem; color: var(--muted); transition: background .15s; }
.kd-beat.first { border-bottom: 6px solid var(--k1); }
.kd-beat.lit { background: var(--k2); color: #fff; }
/* pentagramma */
.kd-penta svg { width: 100%; max-width: 480px; height: auto; }
.kd-pl { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: kd-draw 1.2s ease forwards; }
@keyframes kd-draw { to { stroke-dashoffset: 0; } }
.kd-penta text { fill: var(--muted); font: 700 12px var(--f-body, sans-serif); }
.kd-ps { fill: transparent; transition: fill .2s; }
.kd-ps.hi { fill: var(--k2); opacity: .55; }
.kd-pl.hi { stroke: var(--k1); stroke-width: 7; }
/* tasti */
.kd-keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.kd-key { font: inherit; width: 72px; height: 150px; border-radius: 14px 14px 18px 18px; border: 0; background: var(--c); color: #fff; font-weight: 800; font-size: 1.15rem; display: grid; align-items: end; justify-items: center; padding-bottom: 12px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.22); }
.kd-key:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
/* tema Kids */
body.kids { --accent: #E5484D; --accent-soft: #FDE7E8; --accent-ink: #fff; font-size: 19px; }
:root[data-theme="dark"] body.kids { --accent: #FF8A8E; --accent-soft: #4A2024; --accent-ink: #2A0A0C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.kids { --accent: #FF8A8E; --accent-soft: #4A2024; --accent-ink: #2A0A0C; } }
body.kids .ch-h h1, body.kids .hero h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); }
body.kids .blk { padding: 22px; border-radius: 24px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--line); }

/* lavagna */
body.board-on { overflow: hidden; }
.board { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.bd-top, .bd-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.bd-nav { border-bottom: 0; border-top: 1px solid var(--line); }
.bd-t { font-weight: 800; font-size: 1.1rem; }
.bd-n { font-weight: 800; color: var(--muted); font-size: 1.2rem; }
.bd-body { flex: 1; overflow: auto; padding: 24px max(20px, 5vw); max-width: 1100px; width: 100%; margin: 0 auto; font-size: clamp(1.25rem, 2.4vw, 1.9rem); line-height: 1.5; }
.bd-body .blk { margin: 0; padding: 0; border: 0; box-shadow: none; background: none; }
.bd-body .blk h3 { font-size: clamp(2rem, 4.5vw, 3.2rem); margin-bottom: 14px; }
.bd-body .kd { font-size: 1rem; }
.bd-body .kd-big { font-size: 4rem; }
.bd-body .kd-btn { font-size: 1.3rem; padding: 14px 26px; }
.bd-title { text-align: center; padding-top: 6vh; }
.bd-title h1 { font-size: clamp(2.6rem, 7vw, 5rem); margin: 10px 0 20px; }
.bd-no { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }

.bd-rem { text-align: center; }
.bd-rem h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin-bottom: 16px; }
@media (max-width: 640px) { .kd-figrow { grid-template-columns: 1fr; } .kd-durrow { grid-template-columns: 1fr auto; } .kd-lab { grid-column: 1 / -1; } .kd-key { width: 38px; height: 110px; font-size: .85rem; } .kd-beat { width: 40px; height: 60px; font-size: 1.3rem; } }
@media (prefers-reduced-motion: reduce) { .kd-vib.on .kd-str, .kd-vib.on .kd-waves circle, .pop, .kd-heart.pop { animation-duration: .01s; animation-iteration-count: 1; } .kd-pl { animation: none; stroke-dashoffset: 0; } }
@media print { .board, .board-bar, .kd { display: none; } }

  .bd-body .blk.dbl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); column-gap: 44px; align-items: start; }
  .bd-body .blk.dbl > h3 { grid-column: 1 / -1; }
  .bd-body .blk.dbl > p, .bd-body .blk.dbl > ul, .bd-body .blk.dbl > ol { grid-column: 1; margin-top: 0; }
  .bd-body .blk.dbl > :not(h3):not(p):not(ul):not(ol) { grid-column: 2; grid-row: 2 / span 12; margin-top: 0; }
}
.bd-sub { font-size: .8em; color: var(--muted); max-width: 30em; margin: 0 auto; }
.bd-ex .bd-q { font-weight: 700; font-size: 1.15em; }
.bd-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 14px; margin: 18px 0; }
.bd-opt { display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; font-size: .9em; padding: 14px 18px; border: 3px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); cursor: pointer; }
.bd-opt .opt-l { flex: none; width: 2.1em; height: 2.1em; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); font-weight: 800; }
.bd-opt.right { border-color: #2F9E50; background: #E6F6EA; color: #123; } .bd-opt.wrong { border-color: #E5484D; background: #FCE8E9; color: #123; }
.bd-opt.key { outline: 4px solid #2F9E50; outline-offset: 2px; }
.bd-solbar { margin: 8px 0; } .bd-sol { margin-top: 10px; padding: 16px 20px; border-radius: 18px; background: var(--accent-soft); font-size: .85em; }
@media (min-width: 1500px) {
  .shell { max-width: 1560px; grid-template-columns: 320px minmax(0, 1fr); }
  .top-in { max-width: 1560px; }
  .panel, .pn, .gl { max-width: 64rem; }
  .panel { font-size: 1.06rem; }
}
.bd-body .cq svg { max-width: min(100%, 68vh); }
.bd-body .ev-r svg, .bd-body .cl svg { max-width: 100%; }

/* lavagna: più paragrafi per schermata */
.bd-multi { display: grid; grid-template-columns: 1fr; gap: 26px 40px; align-items: start; font-size: .84em; }
@media (min-width: 1100px) { .bd-multi.n2 { grid-template-columns: 1fr 1fr; } .bd-multi.n3 { grid-template-columns: 1fr 1fr 1fr; } }
.bd-multi .blk { padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.bd-multi .blk h3 { font-size: calc(clamp(1.3rem, 2.2vw, 1.9rem) * var(--bz)); margin-bottom: 8px; }
.bd-multi .stf { max-height: 30vh; }
.bd-ex .stf { max-height: 30vh; }
.bd-ex .fig { padding: 12px 22px; margin: 8px 0; }
.bd-ex .bd-q { margin-bottom: 4px; }

/* ---------- accessibilità ---------- */
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:999;background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;text-decoration:none}
.skip:focus{top:8px}
.gate-top{display:flex;justify-content:flex-end;padding:12px 16px}
.stf-desc{margin:8px 0 0;padding:10px 14px;border-left:5px solid #1f6feb;background:rgba(31,111,235,.08);border-radius:8px;font-size:.95rem;line-height:1.55}
.a11y-btn[aria-pressed="true"]{background:#1f6feb;color:#fff;border-color:#1f6feb}
body.a11y{font-size:118%;line-height:1.65;--ink:#000}
body.a11y :focus-visible{outline:4px solid #ffbf00!important;outline-offset:3px}
body.a11y .btn,body.a11y .opt,body.a11y .tab,body.a11y button,body.a11y a{min-height:44px}
body.a11y .hero-staff,body.a11y .kd-waves,body.a11y .kd-ball{display:none}
body.a11y *,body.a11y *::before,body.a11y *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
body.a11y .btn-play{min-width:140px;font-size:1.05rem}
body.a11y .opt{border-width:3px}
body.a11y .opt[aria-pressed="true"]{outline:3px solid currentColor}
body.a11y .fb{font-size:1.05rem;font-weight:700}

</style>

/* Notazione musicale: converte una stringa breve in un pentagramma SVG.
   Esempio: "t 4/4 C4:q D4:q E4:h | G4:w ||"  (t = violino, b = basso) */
const NOTA = (function () {
  const S = 250, YB = 1000, FDY = -95;
  const LET = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  const W = { w: 1150, h: 820, q: 600, e: 440, s: 380 };
  const NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];

  function parse(str) {
    const toks = String(str || '').trim().split(/\s+/).filter(Boolean);
    let i = 0, clef = 't';
    if (toks[0] === 't' || toks[0] === 'b') { clef = toks[0]; i = 1; }
    const o = { clef, ts: null, key: null, nostem: false, items: [] };
    for (; i < toks.length; i++) {
      const t = toks[i]; let m;
      if (t === '@n') { o.nostem = true; continue; }
      if (/^\d+\/\d+$/.test(t)) { o.ts = t.split('/'); continue; }
      if ((m = t.match(/^k([#b])(\d)$/))) { o.key = { k: m[1], n: +m[2] }; continue; }
      if (t === '|' || t === '||' || t === '|:' || t === ':|') { o.items.push({ t: 'bar', k: t }); continue; }
      if (t === '(') { o.items.push({ t: 'sl', s: 1 }); continue; }
      if (t === ')') { o.items.push({ t: 'sl', s: 0 }); continue; }
      if ((m = t.match(/^r:([whqes])(\.{0,3})$/))) { o.items.push({ t: 'rest', d: m[1], dot: m[2].length }); continue; }
      const parts = t.split(':'); const pitch = parts[0]; const rest = parts[1] || '';
      const dm = rest.match(/^([whqes])?([.'^_]*)$/);
      if (!dm) continue;
      const notes = [];
      let ok = true;
      pitch.split('+').forEach(p => {
        const pm = p.match(/^([A-G])([#b]?)(\d)$/);
        if (!pm) { ok = false; return; }
        notes.push({ l: pm[1], acc: pm[2], oct: +pm[3], step: (+pm[3]) * 7 + LET[pm[1]] });
      });
      if (!ok || !notes.length) continue;
      const fl = dm[2] || '';
      o.items.push({ t: 'note', notes, d: dm[1] || 'q', dot: (fl.match(/\./g) || []).length, tie: fl.includes('_'), stac: fl.includes("'"), ferm: fl.includes('^') });
    }
    return o;
  }

  const f = n => Math.round(n * 10) / 10;
  const dw = d => (d ? 150 + (d - 1) * 110 : 0);
  function glyph(key, x, y, cls) {
    const g = GL[key]; if (!g) return '';
    return `<path${cls ? ` class="${cls}"` : ''} transform="translate(${f(x)} ${f(y)}) scale(1 -1)" d="${g.d}"/>`;
  }

  function head(x, y, d, nostem) {
    if (d === 'w') return `<g transform="translate(${f(x)} ${f(y)})"><ellipse rx="182" ry="124"/><ellipse class="hole" rx="64" ry="112" transform="rotate(38)"/></g>`;
    if (d === 'h') return `<g transform="translate(${f(x)} ${f(y)}) rotate(-24)"><ellipse rx="150" ry="112"/><ellipse class="hole" rx="108" ry="52" transform="rotate(-8)"/></g>`;
    return `<ellipse transform="translate(${f(x)} ${f(y)}) rotate(-24)" rx="150" ry="112"/>`;
  }

  function render(str, opts) {
    opts = opts || {};
    const P = parse(str);
    const bottom = P.clef === 't' ? 30 : 18, top = bottom + 8, mid = bottom + 4;
    const Y = s => YB - (s - bottom) * S / 2;
    const parts = [], beams = [];
    let x = 70, minY = -450, maxY = 1450;
    const staffLines = [];
    // chiave
    parts.push(P.clef === 't' ? glyph('gclef', x, YB) : glyph('fclef', x, YB + FDY));
    x += P.clef === 't' ? 800 : 880;
    // armatura
    if (P.key) {
      const base = P.clef === 't' ? 0 : -14;
      const order = P.key.k === '#' ? [38, 35, 39, 36, 33, 37, 34] : [34, 37, 33, 36, 32, 35, 31];
      for (let k = 0; k < P.key.n; k++) {
        parts.push(glyph(P.key.k === '#' ? 'sharp' : 'flat', x, Y(order[k] + base) + 132));
        x += 210;
      }
      x += 130;
    }
    // tempo
    if (P.ts) {
      parts.push(`<text class="ts" x="${x + 190}" y="${YB - 2 * S - 8 + 2}" text-anchor="middle" font-size="720">${P.ts[0]}</text>`);
      parts.push(`<text class="ts" x="${x + 190}" y="${YB - 8 + 2}" text-anchor="middle" font-size="720">${P.ts[1]}</text>`);
      x += 520;
    }
    x += 80;
    const items = P.items;
    // direzione gambi e posizioni
    const live = [];
    items.forEach((it, idx) => {
      if (it.t === 'note') {
        const steps = it.notes.map(n => n.step);
        const lo = Math.min(...steps), hi = Math.max(...steps);
        it.lo = lo; it.hi = hi;
        const avg = (lo + hi) / 2;
        it.up = avg < mid;
        const accN = it.notes.some(n => n.acc) ? 340 : 0;
        it.x = x + accN + 150;
        x += W[it.d] + accN + dw(it.dot);
        live.push(it);
      } else if (it.t === 'rest') {
        it.x = x + 150; x += W[it.d] + dw(it.dot);
      } else if (it.t === 'bar') {
        x += (it.k === ':|' ? 30 : 60);
        it.x = x;
        x += (it.k === '||' || it.k === ':|' ? 140 : it.k === '|:' ? 190 : 120);
      }
    });
    const endX = x + 40;
    // raggruppamento in travi (crome e semicrome adiacenti)
    if (!P.nostem) {
      let run = [];
      const flush = () => {
        if (run.length > 1) {
          const size = run[0].d === 's' ? 4 : 2;
          for (let a = 0; a < run.length; a += size) {
            const g = run.slice(a, a + size);
            if (g.length > 1) {
              const avg = g.reduce((s, n) => s + (n.lo + n.hi) / 2, 0) / g.length;
              const up = avg < mid;
              g.forEach(n => { n.up = up; n.beam = g; });
            }
          }
        }
        run = [];
      };
      items.forEach(it => {
        if (it.t === 'note' && (it.d === 'e' || it.d === 's')) run.push(it);
        else if (it.t === 'sl') { /* le legature non interrompono */ }
        else flush();
      });
      flush();
    }
    // disegno elementi
    items.forEach(it => {
      if (it.t === 'bar') {
        const xx = it.x;
        if (it.k === '|') parts.push(`<rect x="${xx - 8}" y="${YB - 4 * S}" width="16" height="${4 * S}"/>`);
        else if (it.k === '||') parts.push(`<rect x="${xx - 60}" y="${YB - 4 * S}" width="16" height="${4 * S}"/><rect x="${xx - 20}" y="${YB - 4 * S}" width="56" height="${4 * S}"/>`);
        else if (it.k === ':|') parts.push(`<rect x="${xx - 60}" y="${YB - 4 * S}" width="16" height="${4 * S}"/><rect x="${xx - 20}" y="${YB - 4 * S}" width="56" height="${4 * S}"/><circle cx="${xx - 130}" cy="${YB - 1.5 * S}" r="36"/><circle cx="${xx - 130}" cy="${YB - 2.5 * S}" r="36"/>`);
        else if (it.k === '|:') parts.push(`<rect x="${xx - 20}" y="${YB - 4 * S}" width="56" height="${4 * S}"/><rect x="${xx + 60}" y="${YB - 4 * S}" width="16" height="${4 * S}"/><circle cx="${xx + 140}" cy="${YB - 1.5 * S}" r="36"/><circle cx="${xx + 140}" cy="${YB - 2.5 * S}" r="36"/>`);
      } else if (it.t === 'rest') {
        const xx = it.x;
        if (it.d === 'w') parts.push(`<rect x="${xx - 170}" y="${YB - 3 * S}" width="340" height="125"/>`);
        else if (it.d === 'h') parts.push(`<rect x="${xx - 170}" y="${YB - 2 * S - 125}" width="340" height="125"/>`);
        else parts.push(glyph(it.d === 'q' ? 'rq' : it.d === 'e' ? 're' : 'rs', xx - 150, YB));
        for (let k = 0; k < it.dot; k++) parts.push(`<circle cx="${xx + 200 + k * 110}" cy="${YB - 2.5 * S}" r="40"/>`);
      } else if (it.t === 'note') {
        const xx = it.x;
        const ys = it.notes.map(n => Y(n.step));
        const yTop = Math.min(...ys), yBot = Math.max(...ys);
        minY = Math.min(minY, yTop - (it.d === 'w' || P.nostem ? 300 : 1000));
        maxY = Math.max(maxY, yBot + (it.d === 'w' || P.nostem ? 300 : 1000));
        // linee addizionali
        const ledger = [];
        for (let o = bottom - 2; o >= it.lo - 0; o -= 2) if (o <= bottom - 2 && o >= it.lo) ledger.push(o);
        for (let o = top + 2; o <= it.hi; o += 2) ledger.push(o);
        ledger.forEach(o => parts.push(`<rect class="lg" x="${xx - 230}" y="${Y(o) - 8}" width="460" height="16"/>`));
        // gambo
        const stem = !(it.d === 'w' || P.nostem);
        if (stem && !it.beam) {
          if (it.up) {
            const end = Math.min(yTop - 3.5 * S, YB - 2 * S);
            parts.push(`<rect x="${xx + 128}" y="${end}" width="18" height="${yBot - end}"/>`);
            if (it.d === 'e' || it.d === 's') {
              const n = it.d === 's' ? 2 : 1;
              for (let k = 0; k < n; k++) parts.push(`<path transform="translate(${xx + 146} ${end + k * 130})" d="M0 0c0 110 210 190 190 440c-30 -150 -110 -190 -190 -270Z"/>`);
            }
          } else {
            const end = Math.max(yBot + 3.5 * S, YB - 2 * S);
            parts.push(`<rect x="${xx - 146}" y="${yTop}" width="18" height="${end - yTop}"/>`);
            if (it.d === 'e' || it.d === 's') {
              const n = it.d === 's' ? 2 : 1;
              for (let k = 0; k < n; k++) parts.push(`<path transform="translate(${xx - 146} ${end - k * 130})" d="M0 0c0 -110 210 -190 190 -440c-30 150 -110 190 -190 270Z"/>`);
            }
          }
        }
        // teste e alterazioni
        it.notes.forEach(n => {
          const y = Y(n.step);
          parts.push(head(xx, y, it.d, P.nostem));
          if (n.acc) parts.push(glyph(n.acc === '#' ? 'sharp' : 'flat', xx - 400, y + 132));
        });
        if (it.dot) {
          const onLine = ((it.notes[it.notes.length - 1].step - bottom) % 2 + 2) % 2 === 0;
          for (let k = 0; k < it.dot; k++) parts.push(`<circle cx="${xx + 250 + k * 110}" cy="${Y(it.notes[it.notes.length - 1].step) - (onLine ? 125 : 0)}" r="40"/>`);
        }
        if (it.stac) {
          const yy = it.up ? yBot + 250 : yTop - 250;
          parts.push(`<circle cx="${xx}" cy="${yy}" r="42"/>`);
          minY = Math.min(minY, yy - 100); maxY = Math.max(maxY, yy + 100);
        }
        if (it.ferm) {
          parts.push(glyph('fermata', xx - 379, YB - 4 * S + 498 - 150 - 100));
          minY = Math.min(minY, -700);
        }
      }
    });
    // travi
    const seen = new Set();
    items.forEach(it => {
      if (it.t !== 'note' || !it.beam || seen.has(it.beam)) return;
      const g = it.beam; seen.add(g);
      const up = g[0].up;
      const ext = up ? Math.min(...g.map(n => Y(n.hi) - 3.5 * S)) : Math.max(...g.map(n => Y(n.lo) + 3.5 * S));
      const bY = up ? Math.min(ext, YB - 2 * S) : Math.max(ext, YB - 2 * S);
      const sx = n => up ? n.x + 128 : n.x - 146;
      g.forEach(n => {
        const ys = n.notes.map(q => Y(q.step));
        if (up) parts.push(`<rect x="${sx(n)}" y="${bY}" width="18" height="${Math.max(...ys) - bY}"/>`);
        else parts.push(`<rect x="${sx(n)}" y="${Math.min(...ys)}" width="18" height="${bY - Math.min(...ys)}"/>`);
        minY = Math.min(minY, bY - 160); maxY = Math.max(maxY, bY + 260);
      });
      const x1 = sx(g[0]), x2 = sx(g[g.length - 1]) + 18, th = 110;
      const lines = g[0].d === 's' ? 2 : 1;
      for (let k = 0; k < lines; k++) {
        const dy = up ? k * 175 : -k * 175 - th;
        parts.push(`<rect x="${x1}" y="${bY + (up ? 0 : 0) + dy + (up ? 0 : th * 0)}" width="${x2 - x1}" height="${th}"/>`);
      }
    });
    // legature di valore
    items.forEach((it, idx) => {
      if (it.t !== 'note' || !it.tie) return;
      const nxt = items.slice(idx + 1).find(q => q.t === 'note');
      if (!nxt) return;
      const down = it.up; // legatura sul lato opposto al gambo
      const y1 = Y(it.notes[0].step), s = down ? 1 : -1;
      const xa = it.x + 160, xb = nxt.x - 160;
      const y0 = y1 + s * 170;
      parts.push(`<path class="tie" d="M${f(xa)} ${f(y0)}Q${f((xa + xb) / 2)} ${f(y0 + s * 340)} ${f(xb)} ${f(y0)}Q${f((xa + xb) / 2)} ${f(y0 + s * 250)} ${f(xa)} ${f(y0)}Z"/>`);
      maxY = Math.max(maxY, y0 + 400); minY = Math.min(minY, y0 - 400);
    });
    // legature di portamento
    let open = null;
    items.forEach((it, idx) => {
      if (it.t === 'sl' && it.s === 1) open = items.slice(idx + 1).find(q => q.t === 'note');
      if (it.t === 'sl' && it.s === 0 && open) {
        let last = null; for (let k = idx - 1; k >= 0; k--) if (items[k].t === 'note') { last = items[k]; break; }
        if (!last) return;
        const seq = items.slice(items.indexOf(open), items.indexOf(last) + 1).filter(q => q.t === 'note');
        const ups = seq.filter(q => q.up).length;
        const above = ups <= seq.length / 2;
        const yv = seq.map(q => Y(above ? q.hi : q.lo));
        const ext = above ? Math.min(...yv) - 330 : Math.max(...yv) + 330;
        const xa = open.x - 40, xb = last.x + 40, s = above ? -1 : 1;
        parts.push(`<path class="tie" d="M${f(xa)} ${f(ext)}Q${f((xa + xb) / 2)} ${f(ext + s * 400)} ${f(xb)} ${f(ext)}Q${f((xa + xb) / 2)} ${f(ext + s * 310)} ${f(xa)} ${f(ext)}Z"/>`);
        minY = Math.min(minY, ext - 450); maxY = Math.max(maxY, ext + 450);
        open = null;
      }
    });
    // pentagramma
    for (let k = 0; k < 5; k++) staffLines.push(`<rect class="sl" x="0" y="${YB - k * S - 8}" width="${endX}" height="16"/>`);
    const vbY = Math.floor(minY), vbH = Math.ceil(maxY - minY);
    const label = (opts.label || 'Esempio musicale su pentagramma') + '. ' + describe(str, opts.hide);
    const scale = opts.scale || 0.082;
    return `<svg class="stf" role="img" aria-label="${label.replace(/"/g, '&quot;')}" viewBox="0 ${vbY} ${Math.ceil(endX)} ${vbH}" style="width:${Math.round(endX * scale)}px;max-width:100%" fill="currentColor">${staffLines.join('')}${parts.join('')}</svg>`;
  }


  /* Descrizione a parole di un pentagramma (per screen reader e display Braille).
     hide = true: non dice i nomi delle note (negli esercizi in cui il nome è la risposta). */
  const DUR = { w: 'semibreve', h: 'minima', q: 'semiminima', e: 'croma', s: 'semicroma' };
  const DOT = ['', ' puntata', ' con doppio punto', ' con triplo punto'];
  function describe(str, hide) {
    const P = parse(str), out = [];
    out.push(P.clef === 'b' ? 'Chiave di basso' : 'Chiave di violino');
    if (P.key) out.push('armatura di ' + P.key.n + (P.key.k === '#' ? ' diesis' : (P.key.n === 1 ? ' bemolle' : ' bemolli')));
    if (P.ts) out.push('tempo ' + P.ts[0] + '/' + P.ts[1]);
    const seq = [];
    P.items.forEach(it => {
      if (it.t === 'bar') seq.push({ '|': 'stanghetta', '||': 'doppia stanghetta finale', '|:': 'inizio del ritornello', ':|': 'fine del ritornello' }[it.k] || 'stanghetta');
      else if (it.t === 'sl') seq.push(it.s ? 'inizia una legatura' : 'finisce la legatura');
      else if (it.t === 'rest') seq.push('pausa di ' + DUR[it.d] + DOT[it.dot || 0]);
      else if (it.t === 'note') {
        const nm = it.notes.map(n => NAMES[LET[n.l]] + (n.acc === '#' ? ' diesis' : n.acc === 'b' ? ' bemolle' : '') + ' ' + n.oct);
        let t = hide ? (it.notes.length > 1 ? 'accordo di ' + it.notes.length + ' note' : 'nota') : (it.notes.length > 1 ? nm.join(' e ') + ' insieme' : nm[0]);
        t += ', ' + DUR[it.d] + DOT[it.dot || 0];
        if (it.tie) t += ', legata alla successiva';
        if (it.stac) t += ', staccato';
        if (it.ferm) t += ', con corona';
        seq.push(t);
      }
    });
    let txt = out.join(', ') + '.';
    const nn = P.items.reduce((a, i) => a + (i.t === 'note' ? i.notes.length : 0), 0);
    if (seq.length) txt += ' ' + (nn ? nn + (nn === 1 ? ' nota' : ' note') + '. ' : '') + 'Da sinistra a destra: ' + seq.join('; ') + '.';
    if (hide) txt += ' I nomi delle note non vengono letti per non svelare la risposta.';
    return txt;
  }

  return { render, parse, describe, NAMES };
})();

<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const app = $('#app');
  const LEVEL_CLASS = ['l1', 'l2', 'l3'];
  const RUOLI = { segreteria: 'Segreteria', docente: 'Docente', allievo: 'Allievo' };
  const KEY_S = 'dfa-teoria-sessione';
  const KEY_N = 'dfa-teoria-note-';

  /* ---------- stato ---------- */
  let SESS = null;            // { token, user }
  let DATA = null;            // contenuti della sezione aperta
  let SEZ = null;             // sezione aperta { id, nome, desc }
  let PROG = {};              // progressi dell'allievo: { idCapitolo: { 'aula-0': true } }
  let mode = 'allievo';       // 'allievo' | 'docente' (solo per chi non è allievo)
  let route = { v: 'portal', i: 0, tab: 'teoria' };
  let editing = false, dirty = false, saveMsg = '', pendingDelete = null, editOnArrive = false, leaveArmed = false;
  let res = {}, expl = {}, busy = {};      // risposte a scelta (solo in memoria)
  let tries = {}, savedT = {};              // tentativi per esercizio e test già salvati (solo in memoria)
  let notes = {};                          // risposte aperte (solo in questo browser)
  let lastPwd = '';
  let login = { utente: '', msg: '', busy: false };
  let pw = { msg: '', busy: false };
  let adm = null;                          // stato della gestione utenze
  let pg = null;                           // stato dei progressi

  const isAll = () => !!SESS && SESS.user.ruolo === 'allievo';
  const isSeg = () => !!SESS && SESS.user.ruolo === 'segreteria';
  const isStaff = () => !!SESS && SESS.user.ruolo !== 'allievo';
  const showT = () => isStaff() && mode === 'docente';
  const TEACH_BANNER = '<p class="teach-banner">📚 <strong>Materiale a disposizione dei docenti</strong>: supporto alla didattica in sola consultazione, con soluzioni e note per il docente.</p>';
  const canEd = () => showT() && SESS.user.ruolo === 'segreteria';

  /* ---------- chiamate al server ---------- */
  function cleanErr(e) {
    let m = (e && e.message) ? String(e.message) : String(e || '');
    m = m.replace(/^(Error|Exception):\s*/i, '');
    return m || 'Qualcosa non ha funzionato. Riprova.';
  }
  function api(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (!(window.google && google.script && google.script.run)) {
      const cfg = String(window.DFA_EXEC_URL || ''); const url = /^https:\/\/script\.google\.com\//.test(cfg) || /^https:\/\/script\.test\//.test(cfg) ? cfg : 'https://script.google.com/macros/s/AKfycbydv0K9dp-st9UFi2AfGNmdiKqtQl_le8_D4xjghuPO2alcsZ3DNenhBa4G4qGJu4_O/exec';
      if (!url) return Promise.reject(new Error('Servizio non raggiungibile da questa pagina.'));
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
        .then(r => r.json(), () => { throw new Error('Connessione non riuscita. Controlla la rete e riprova.'); })
        .then(j => { if (!j || !j.ok) throw new Error(cleanErr(new Error(j && j.e))); return j.r; });
    }
    return new Promise((ok, ko) => {
      try {
        google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(new Error(cleanErr(e))))[fn].apply(null, args);
      } catch (e) { ko(new Error(cleanErr(e))); }
    });
  }
  function tcall(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (!SESS) return Promise.reject(new Error('Sessione scaduta. Accedi nuovamente.'));
    return api.apply(null, [fn, SESS.token].concat(args)).catch(e => {
      if (/Sessione scaduta|Sessione non valida/i.test(e.message)) expire();
      throw e;
    });
  }
  function expire(msg) {
    SESS = null; DATA = null; SEZ = null; PROG = {}; tries = {}; savedT = {}; adm = null; pg = null; PORTAL = null; MAT = null; editing = false; dirty = false; route = { v: 'portal', i: 0, tab: 'teoria' };
    try { localStorage.removeItem(KEY_S); } catch (e) { }
    login.msg = msg || 'La sessione è scaduta. Accedi di nuovo.'; login.busy = false;
    render();
  }

  /* ---------- memoria locale (solo comodità) ---------- */
  function loadNotes() { notes = {}; try { const r = localStorage.getItem(KEY_N + SESS.user.id); if (r) notes = JSON.parse(r) || {}; } catch (e) { } }
  let saveT = null;
  function saveNotes() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY_N + SESS.user.id, JSON.stringify(notes)); } catch (e) { } }, 250); }

  /* ---------- testo ---------- */
  function md(s) {
    s = esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return s.split(/\n\n+/).map(b => {
      const lines = b.split('\n');
      if (lines.every(l => /^- /.test(l))) return '<ul>' + lines.map(l => '<li>' + l.slice(2) + '</li>').join('') + '</ul>';
      return '<p>' + lines.join('<br>') + '</p>';
    }).join('');
  }
  const staffPrint = (str, label) => NOTA.render(str, { label });
  /* Modalità accessibile (allievi non vedenti o ipovedenti): descrizione scritta di ogni pentagramma e tasto Ascolta */
  const A11Y_KEY = 'dfa-a11y';
  /* Modalità accessibile: la attiva la segreteria sull'account (casella «Modalità accessibile»).
     Chi non ce l'ha non vede né pulsante né descrizioni. La segreteria può sempre provarla.
     Nella pagina di prova (DFA_A11Y_TEST) il pulsante è disponibile a tutti. */
  const a11yFlag = () => !!(SESS && SESS.user && SESS.user.accessibile);
  const canA11y = () => !!(window.DFA_A11Y_TEST || a11yFlag() || (SESS && SESS.user && SESS.user.ruolo === 'segreteria'));
  const a11yKey = () => A11Y_KEY + ((SESS && SESS.user && SESS.user.id) || '');
  const a11yOn = () => { if (!canA11y()) return false; let v = null; try { v = localStorage.getItem(a11yKey()); } catch (e) { } return v === null ? a11yFlag() : v === '1'; };
  const a11yBtn = cls => !canA11y() ? '' : '<button type="button" class="btn ghost sm a11y-btn ' + (cls || '') + '" data-act="a11y" aria-pressed="' + a11yOn() + '">♿ Accessibilità: ' + (a11yOn() ? 'attiva' : 'non attiva') + '</button>';
  const skipLink = () => '<a class="skip" href="#main" data-act="skip">Vai al contenuto</a>';
  const hidesPitch = e => !!(e && e.staff && ((e.opz || []).some(o => /(^|[^a-zà-ù])(do|re|mi|fa|sol|la|si)([^a-zà-ù]|$)/i.test(String(o))) || /nom[ei]|quale nota|che nota|riconosci|leggi|scrivi il nome/i.test(String(e.q || ''))));
  const staff = (str, label, hide) => {
    const svg = NOTA.render(str, { label: label, hide: !!hide });
    return svg + (a11yOn() ? '<p class="stf-desc"><strong>Descrizione:</strong> ' + esc(NOTA.describe(str, !!hide)) + '</p>' : '');
  };
  function glyphIcon(key, h) {
    const g = GL[key]; if (!g) return '';
    const b = g.b, pad = 30;
    return '<svg class="sym-svg" viewBox="' + (b[0] - pad) + ' ' + (-b[3] - pad) + ' ' + (b[2] - b[0] + 2 * pad) + ' ' + (b[3] - b[1] + 2 * pad) + '" style="height:' + (h || 44) + 'px" aria-hidden="true" fill="currentColor"><path transform="scale(1 -1)" d="' + g.d + '"/></svg>';
  }
  function fmtData(iso) {
    if (!iso) return 'mai';
    const d = new Date(iso); if (isNaN(d)) return 'mai';
    return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  }
  function telVista(t) {
    t = String(t || ''); if (/^39\d{9,10}$/.test(t)) return '+39 ' + t.slice(2);
    return t ? '+' + t : '';
  }
  function slug(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, '.').replace(/[^a-z0-9._-]/g, '').slice(0, 30);
  }

  /* ---------- tastiera ---------- */
  function keyboard() {
    const names = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si', 'Do'];
    const kw = 100, kh = 360; let w = '', bl = '';
    const semi = [2, 3, 6, 7];
    names.forEach((n, i) => {
      w += '<rect class="' + (semi.includes(i) ? 'k-semi' : 'k-white') + '" x="' + (i * kw + 2) + '" y="2" width="' + (kw - 4) + '" height="' + kh + '" rx="8"/><text class="k-lab" x="' + (i * kw + kw / 2) + '" y="' + (kh - 24) + '" text-anchor="middle">' + n + '</text>';
    });
    [1, 2, 4, 5, 6].forEach(p => { bl += '<rect class="k-black" x="' + (p * kw - 30) + '" y="2" width="60" height="' + (kh * 0.62) + '" rx="6"/>'; });
    return '<figure class="kb"><svg viewBox="0 0 ' + (8 * kw + 4) + ' ' + (kh + 70) + '" role="img" aria-label="Una ottava di tastiera da Do a Do. Mi-Fa e Si-Do sono evidenziati: sono i semitoni naturali." fill="currentColor">' + w + bl + '<text class="k-note" x="' + (3 * kw) + '" y="' + (kh + 46) + '" text-anchor="middle">Mi - Fa</text><text class="k-note" x="' + (7 * kw) + '" y="' + (kh + 46) + '" text-anchor="middle">Si - Do</text></svg><figcaption>I tasti gialli sono coppie di note vicine senza un tasto nero in mezzo: tra loro c\'è un semitono.</figcaption></figure>';
  }

/* ---------- piramide delle figure e circolo delle quinte ---------- */
  function pyramid(rows) {
    const gap = n => n <= 16 ? 3 : n <= 32 ? 2 : 1;
    return '<figure class="pir" role="img" aria-label="Piramide delle figure musicali: ogni riga è lunga quanto una semibreve ed è divisa in parti uguali">' + rows.map((r, i) => {
      const n = Math.max(1, parseInt(r[1], 10) || 1);
      return `<div class="pir-r"><span class="pir-n">${esc(r[0])}</span><div class="pir-b" style="--n:${n};--g:${gap(n)}px;--o:${(0.55 + 0.45 * i / Math.max(1, rows.length - 1)).toFixed(2)}"></div><span class="pir-v">${esc(r[2] || '')}</span></div>`;
    }).join('') + '<figcaption>Ogni riga ha la stessa durata complessiva: più la figura è breve, più ne servono per riempirla.</figcaption></figure>';
  }
  function circleFifths() {
    const M = ['Do', 'Sol', 'Re', 'La', 'Mi', 'Si', 'Fa♯ / Sol♭', 'Re♭', 'La♭', 'Mi♭', 'Si♭', 'Fa'];
    const m = ['La', 'Mi', 'Si', 'Fa♯', 'Do♯', 'Sol♯', 'Re♯ / Mi♭', 'Si♭', 'Fa', 'Do', 'Sol', 'Re'];
    const a = ['0', '1♯', '2♯', '3♯', '4♯', '5♯', '6♯ / 6♭', '5♭', '4♭', '3♭', '2♭', '1♭'];
    let t = '';
    for (let i = 0; i < 12; i++) {
      const ang = (i * 30 - 90) * Math.PI / 180, c = Math.cos(ang), s2 = Math.sin(ang);
      const P = (r) => `x="${(210 + r * c).toFixed(1)}" y="${(210 + r * s2 + 5).toFixed(1)}"`;
      t += `<text class="cq-a" ${P(190)} text-anchor="middle">${a[i]}</text><text class="cq-M" ${P(150)} text-anchor="middle">${M[i]}</text><text class="cq-m" ${P(100)} text-anchor="middle">${m[i]} m</text>`;
    }
    return `<figure class="cq"><svg viewBox="0 0 420 420" role="img" aria-label="Circolo delle quinte: fuori le tonalità maggiori, dentro le minori relative, all'esterno il numero di alterazioni in armatura"><circle cx="210" cy="210" r="168" class="cq-r1"/><circle cx="210" cy="210" r="122" class="cq-r2"/><circle cx="210" cy="210" r="74" class="cq-r3"/><text x="210" y="206" text-anchor="middle" class="cq-c">in senso</text><text x="210" y="224" text-anchor="middle" class="cq-c">orario: ♯</text>${t}</svg><figcaption>Fuori le tonalità maggiori, dentro le relative minori, all'esterno le alterazioni in armatura. In senso orario si sale di una quinta e si aggiunge un diesis; in senso antiorario si scende di una quinta e si aggiunge un bemolle.</figcaption></figure>`;
  }

  /* ---------- setticlavio, evoluzione grafica, ascolto ---------- */
  function clefsFig() {
    const S = 250, YB = 1000, FDY = -95;
    const spec = [['Violino', 'gclef', 2, 'Sol4', 'Sol sulla 2ª riga'], ['Soprano', 'cclef', 1, 'Do4', 'Do sulla 1ª riga'], ['Mezzosoprano', 'cclef', 2, 'Do4', 'Do sulla 2ª riga'], ['Contralto', 'cclef', 3, 'Do4', 'Do sulla 3ª riga'], ['Tenore', 'cclef', 4, 'Do4', 'Do sulla 4ª riga'], ['Baritono', 'fclef', 3, 'Fa3', 'Fa sulla 3ª riga'], ['Basso', 'fclef', 4, 'Fa3', 'Fa sulla 4ª riga']];
    const cells = spec.map(([nm, gk, n, note, dsc]) => {
      const ly = YB - (n - 1) * S, g = GL[gk];
      let ty;
      if (gk === 'gclef') ty = YB - (n - 2) * S;
      else if (gk === 'fclef') ty = YB + FDY - (n - 4) * S;
      else ty = ly + (g.b[1] + g.b[3]) / 2;
      let lines = '';
      for (let k = 0; k < 5; k++) lines += `<rect x="0" y="${YB - k * S - 8}" width="1250" height="16" class="sl"/>`;
      const svg = `<svg viewBox="0 -450 1250 1950" role="img" aria-label="Chiave di ${nm}: ${dsc}" fill="currentColor">${lines}<path transform="translate(80 ${ty}) scale(1 -1)" d="${g.d}"/><ellipse cx="1030" cy="${ly}" rx="170" ry="120" class="refn" transform="rotate(-20 1030 ${ly})"/></svg>`;
      return `<figure class="cl">${svg}<figcaption><b>${nm}</b><br>${dsc}<br><small>nota di riferimento: ${note}</small></figcaption></figure>`;
    }).join('');
    return `<div class="clefs">${cells}</div>`;
  }

  function evoFig(kind) {
    if (kind === 'chiavi') {
      const col = [['G', 'gclef', 'Sol'], ['F', 'fclef', 'Fa'], ['C', 'cclef', 'Do']].map(([l, gk, nm]) => `<figure class="ev-c"><div class="ev-l" aria-hidden="true">${l}</div><div class="ev-arr" aria-hidden="true">→</div>${glyphIcon(gk, 78)}<figcaption>Lettera <b>${l}</b> = <b>${nm}</b><br>chiave di ${nm}</figcaption></figure>`).join('');
      return `<div class="evo"><div class="evo-row">${col}</div></div>`;
    }
    const sy = ['Ut', 'Re', 'Mi', 'Fa', 'Sol', 'La'], lt = ['C', 'D', 'E', 'F', 'G', 'A'];
    const ypos = [160, 137.5, 115, 92.5, 70, 47.5];
    let q = '';
    for (let k = 0; k < 4; k++) q += `<line x1="10" x2="690" y1="${205 - k * 45}" y2="${205 - k * 45}" stroke="currentColor" stroke-width="2.5"/>`;
    const cg = GL.cclef, sc = 0.1, cy = 160 + sc * (cg.b[1] + cg.b[3]) / 2;
    q += `<path fill="currentColor" transform="translate(24 ${cy}) scale(${sc} ${-sc})" d="${cg.d}"/>`;
    ypos.forEach((y, i) => { q += `<rect x="${170 + i * 85}" y="${y - 11}" width="28" height="22" fill="currentColor"/><line x1="${170 + i * 85 + 27}" x2="${170 + i * 85 + 27}" y1="${y - 11}" y2="${y + 28}" stroke="currentColor" stroke-width="4"/>`; });
    let l = '';
    lt.forEach((c, i) => { l += `<text x="${184 + i * 85}" y="52" text-anchor="middle" class="ev-t">${c}</text><text x="${184 + i * 85}" y="92" text-anchor="middle" class="ev-s">${sy[i]}</text>`; });
    return `<div class="evo"><figure class="ev-r"><figcaption>1. <b>Lettere</b> (secoli IX–XI): ogni suono ha una lettera</figcaption><svg viewBox="0 0 700 110" role="img" aria-label="Le note indicate con le lettere C D E F G A" fill="currentColor">${l}</svg></figure><figure class="ev-r"><figcaption>2. <b>Notazione quadrata</b> su quattro linee (secoli XII–XIII)</figcaption><svg viewBox="0 0 700 250" role="img" aria-label="Le sei note in notazione quadrata con chiave di Do">${q}</svg></figure><figure class="ev-r"><figcaption>3. <b>Notazione moderna</b> su cinque linee</figcaption>${staff('t C4:q D4:q E4:q F4:q G4:q A4:q', 'Do Re Mi Fa Sol La in notazione moderna')}</figure></div>`;
  }

  let AC = null, ACT = null, ACB = null;
  function stopPlay() {
    if (ACT) { clearTimeout(ACT); ACT = null; }
    if (AC) { try { AC.close(); } catch (e) {} AC = null; }
    if (ACB) { ACB.classList.remove('on'); ACB.textContent = '▶ Ascolta'; ACB = null; }
  }
  function startPlay(str, bpm, btn) {
    stopPlay();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { btn.textContent = 'Audio non disponibile'; return; }
    const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }, DU = { w: 4, h: 2, q: 1, e: .5, s: .25 };
    AC = new Ctx(); ACB = btn;
    const spb = 60 / (bpm || 80);
    let t = AC.currentTime + .08;
    String(str).trim().split(/\s+/).forEach(tok => {
      let m = tok.match(/^([A-G])([#b]?)(\d)(?::([whqes]))?(\.)?$/), rest = false;
      if (!m) { m = tok.match(/^r:([whqes])(\.)?$/); if (!m) return; rest = true; }
      const d = (DU[rest ? m[1] : (m[4] || 'q')] || 1) * ((rest ? m[2] : m[5]) ? 1.5 : 1) * spb;
      if (!rest) {
        const midi = 12 * (+m[3] + 1) + PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.28, t + .02);
        g.gain.setValueAtTime(.28, t + d * .7); g.gain.linearRampToValueAtTime(0, t + d * .95);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
      }
      t += d;
    });
    btn.classList.add('on'); btn.textContent = '■ Stop';
    ACT = setTimeout(stopPlay, Math.max(300, (t - AC.currentTime) * 1000 + 200));
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-play]');
    if (!b) return;
    if (b === ACB) stopPlay(); else startPlay(b.getAttribute('data-play'), +b.getAttribute('data-bpm') || 80, b);
  });
  const playUI = (str, bpm) => `<div class="play"><button type="button" class="btn-play" data-play="${esc(str)}" data-bpm="${+bpm || 80}">▶ Ascolta</button><span>Ascolto con suono sintetico</span></div>`;

  /* Leggi a voce: la voce del dispositivo legge la descrizione del pentagramma */
  let SAYB = null;
  const SAYT = '🗣 Leggi a voce';
  function stopSay() { try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { } if (SAYB) { SAYB.textContent = SAYT; SAYB = null; } }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-say]'); if (!b) return;
    if (b === SAYB) { stopSay(); return; }
    stopSay();
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { b.textContent = 'Voce non disponibile su questo dispositivo'; return; }
    const u = new SpeechSynthesisUtterance(b.getAttribute('data-say')); u.lang = 'it-IT'; u.rate = .9;
    u.onend = u.onerror = () => { if (SAYB === b) { SAYB = null; b.textContent = SAYT; } };

  function onEdit(el) {
    const ch = DATA.capitoli[route.i]; const k = el.dataset.ed, i = +el.dataset.i, t = el.dataset.t;
    const lines = v => v.split('\n').map(s => s.trim()).filter(Boolean);

    switch (k) {
      case 'titolo': ch.titolo = el.value; break;
      case 'percorso': ch.percorso = +el.value; break;
      case 'obiettivi': ch.obiettivi = lines(el.value); break;
      case 'ricorda': ch.ricorda = lines(el.value); break;
      case 'docente': ch.docente = el.value; break;
      case 'b.h': b.h = el.value; break;
      case 'b.p': b.p = el.value; break;
      case 'b.cap': if (el.value) b.cap = el.value; else delete b.cap; break;
      case 'b.staff': if (el.value.trim()) b.staff = el.value.trim(); else delete b.staff;
        el.closest('.ed-card').querySelector('.ed-prev').innerHTML = b.staff ? staff(b.staff, 'Anteprima') : ''; break;
      case 'e.q': e.q = el.value; break;
      case 'e.staff': if (el.value.trim()) e.staff = el.value.trim(); else delete e.staff; break;
      case 'e.sol': e.sol = el.value; break;
      case 'e.opz': e.opz = lines(el.value); if (e.ok >= e.opz.length) e.ok = Math.max(0, e.opz.length - 1); break;
      case 'e.ok': e.ok = Math.max(0, Math.min((e.opz || []).length - 1, (parseInt(el.value, 10) || 1) - 1)); break;
      case 'e.tipo':
        e.tipo = el.value;
        if (e.tipo === 'scelta') { e.opz = e.opz && e.opz.length >= 2 ? e.opz : ['Risposta 1', 'Risposta 2']; e.ok = e.ok || 0; }
        dirty = true; saveMsg = ''; render(); return;
    }
    dirty = true; saveMsg = '';
    const sb = $('[data-act="save"]'); if (sb) sb.disabled = false;
    const m = $('.ed-msg'); if (m) m.textContent = 'Ci sono modifiche non salvate.';

  function perArea(items) {
    const m = {};
    (items || []).forEach(g => { const a = areaDi(g); (m[a] = m[a] || []).push(g); });
    const nomi = Object.keys(m).sort((a, b) => {
      const ia = a === AREA_VUOTA ? 999 : AREE_ORD.indexOf(a), ib = b === AREA_VUOTA ? 999 : AREE_ORD.indexOf(b);
      const ra = ia < 0 ? 500 : ia, rb = ib < 0 ? 500 : ib;
      return ra !== rb ? ra - rb : a.localeCompare(b, 'it');
    });

  function dlMat(id) {

    tcall('scaricaMateriale', MAT.gid, id).then(r => {
      const bin = atob(r.b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: r.mime }));
      const a = document.createElement('a'); a.href = url; a.download = r.nome; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) { } }, 120000);
    }).catch(e => toast(e.message));

  function upMat(input) {
    const files = Array.from(input.files || []); input.value = '';
    if (!files.length) return;
    const cart = MAT.cart.cartella.id;
    MAT.msg = ''; MAT.err = ''; MAT.busy = true; render();
    let n = 0;
    const next = i => {
      if (i >= files.length) return Promise.resolve();
      const f = files[i];
      if (f.size > 15 * 1024 * 1024) { MAT.err = '«' + f.name + '» supera i 15 MB: caricalo direttamente su Google Drive.'; return next(i + 1); }
      return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ko(new Error('Non riesco a leggere il file.')); r.readAsDataURL(f); })
        .then(b64 => tcall('caricaMateriale', MAT.gid, cart, f.name, f.type || 'application/octet-stream', b64)).then(() => { n++; }).catch(e => { MAT.err = e.message; }).then(() => next(i + 1));
    };
    next(0).then(() => { if (n) MAT.msg = n === 1 ? 'File caricato.' : n + ' file caricati.'; loadMat(cart); });
  }

  /* ---------- immagini e audio della teoria ---------- */
  const MEDIA = {}, MEDIA_BUSY = {};
  function loadMedia() {
    $$('[data-media]').forEach(el => {
      const name = String(el.dataset.media).split('/').pop();
      const put = u => { if (el.isConnected) el.src = u; };
      if (MEDIA[name]) { put(MEDIA[name]); return; }
      if (MEDIA_BUSY[name]) { MEDIA_BUSY[name].then(() => put(MEDIA[name])); return; }
      MEDIA_BUSY[name] = tcall('leggiMedia', name).then(r => {
        const bin = atob(r.b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        MEDIA[name] = URL.createObjectURL(new Blob([bytes], { type: r.mime })); put(MEDIA[name]);
      }).catch(() => { delete MEDIA_BUSY[name]; });
    });
  }
