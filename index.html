    switch (act) {
      case 'showpw': { const on = el.checked; $$('input[type="password"],input[data-pw="1"]', el.closest('form')).forEach(i => { i.type = on ? 'text' : 'password'; i.dataset.pw = '1'; }); return; }
      case 'a11y': try { localStorage.setItem(a11yKey(), a11yOn() ? '0' : '1'); } catch (e) { } render(); toast(a11yOn() ? 'Modalità accessibile attiva: descrizioni dei pentagrammi e tasto Ascolta.' : 'Modalità accessibile disattivata.'); return;
      case 'skip': ev.preventDefault(); { const m = document.getElementById('main'); if (m) m.focus(); } return;
      case 'logout': expire('Sei uscito. A presto!'); pwOpen = false; lastPwd = ''; return;
      case 'pw-open': pwOpen = true; pw = { msg: '', busy: false }; render(); return;
      case 'pw-cancel': pwOpen = false; render(); return;
      case 'tab': route.tab = el.dataset.t; render(); window.scrollTo({ top: 0 }); break;
      case 'mode': mode = el.dataset.m; if (mode === 'allievo') editing = false; render(); break;
      case 'idx': document.body.classList.toggle('idx-open'); render(); break;
      case 'pick': {
        const d = el.dataset, c = DATA.capitoli.filter(x => x.id === d.ch)[0]; if (!c) break;
        const i = +d.i, j = +d.j, k = exKey(c, d.t, i);
        const keep = window.scrollY;
        if (!isAll()) { const e = c[d.t][i]; res[k] = { j: j, s: j === e.ok ? 'ok' : 'no' }; expl[k] = e.sol || ''; render(); window.scrollTo(0, keep); break; }
        if (busy[k]) break;
        tries[k] = (tries[k] || 0) + 1;
        busy[k] = true; res[k] = { j: j, s: 'wait' }; render(); window.scrollTo(0, keep);
        tcall('verificaRisposta', SEZ.id, c.id, d.t, i, j).then(r => {
          busy[k] = false;
          if (r.giusta) { res[k] = { j: j, s: 'ok' }; expl[k] = r.spiegazione || ''; markDone(c.id, d.t, i, true); inviaTest(c, d.t); } else { res[k] = { j: j, s: 'no' }; }
        }).catch(e => { busy[k] = false; delete res[k]; toast(e.message); }).then(() => { if (SESS) { const y = window.scrollY; render(); window.scrollTo(0, y); } });
        break;
      }
      case 'sch': { const i = +el.dataset.i; if (ch.schede && ch.schede[i]) openHtml(schedaDoc(ch, i, !!el.dataset.sol), 'DomusForm-Kids-Cap' + (route.i + 1) + '-Scheda' + (i + 1) + (el.dataset.sol ? '-Soluzioni' : '') + '.html'); break; }
      case 'dl': openSheet(ch, el.dataset.t, !!el.dataset.sol); break;
      case 'board': boardOpen(DATA.capitoli[route.i], route.i + 1); break;
      case 'edit': editing = true; saveMsg = ''; render(); window.scrollTo({ top: 0 }); break;
      case 'done-edit': editing = false; render(); window.scrollTo({ top: 0 }); break;
      case 'save': save(); break;
      case 'b-add': ch.teoria.push({ h: 'Nuovo paragrafo', p: 'Scrivi qui il testo.' }); dirty = true; render(); break;
      case 'b-up': { const i = +el.dataset.i; if (i > 0) { const t = ch.teoria; const x = t[i - 1]; t[i - 1] = t[i]; t[i] = x; dirty = true; render(); } break; }
      case 'b-down': { const i = +el.dataset.i, t = ch.teoria; if (i < t.length - 1) { const x = t[i + 1]; t[i + 1] = t[i]; t[i] = x; dirty = true; render(); } break; }
      case 'b-del': { const key = 'b' + el.dataset.i; if (pendingDelete === key) { ch.teoria.splice(+el.dataset.i, 1); pendingDelete = null; dirty = true; } else pendingDelete = key; render(); break; }
      case 'e-add': ch[el.dataset.t].push({ tipo: 'aperta', q: 'Scrivi qui la domanda.', sol: '' }); dirty = true; render(); break;
      case 'e-del': { const key = el.dataset.t + el.dataset.i; if (pendingDelete === key) { ch[el.dataset.t].splice(+el.dataset.i, 1); pendingDelete = null; dirty = true; } else pendingDelete = key; render(); break; }
      case 'c-del': if (pendingDelete === 'c') { DATA.capitoli.splice(route.i, 1); pendingDelete = null; dirty = true; editing = false; route = { v: 'home', i: 0, tab: 'teoria' }; render(); } else { pendingDelete = 'c'; render(); } break;
      case 'addcap': DATA.capitoli.push({ id: 'c' + Date.now().toString(36), percorso: 0, titolo: 'Nuovo capitolo', obiettivi: [], teoria: [{ h: 'Primo paragrafo', p: 'Scrivi qui il testo.' }], ricorda: [], docente: '', aula: [], casa: [] }); dirty = true; editOnArrive = true; go_noguard('cap-' + DATA.capitoli.length); break;
      case 'pg-reload': loadProg(); break;
      case 'open-sez': openSez(el.dataset.s); return;
      case 'mat-open': MAT.msg = ''; loadMat(el.dataset.id); return;
      case 'mat-go': go('materiali'); MAT = MAT || {}; MAT.gid = el.dataset.id; return;
      case 'mat-dl': dlMat(el.dataset.id); return;
      case 'mat-del': {
        const id = el.dataset.id;
        if (MAT.del !== id) { MAT.del = id; render(); return; }
        tcall('eliminaMateriale', MAT.gid, id).then(() => { MAT.msg = 'Elemento eliminato.'; loadMat(MAT.cart.cartella.id); }).catch(e => { MAT.err = e.message; MAT.del = null; render(); });
        return;
      }
      case 'area-t': adm.aperte[el.dataset.id] = !adm.aperte[el.dataset.id]; render(); return;
      case 'gedit': adm.gEdit = el.dataset.id; render(); return;
      case 'gcancel': adm.gEdit = null; render(); return;
      case 'copymsg': if (adm && adm.cred) copyText(adm.cred.messaggio); break;
      case 'credclose': adm.cred = null; render(); break;
      case 'uedit': adm.editId = el.dataset.id; render(); break;
      case 'ucancel': adm.editId = null; render(); break;
      case 'indiv-open': adm.indId = adm.indId === el.dataset.id ? null : el.dataset.id; render(); break;
      case 'indiv-cancel': adm.indId = null; render(); break;
      case 'ucred': {
        const id = el.dataset.id;
        if (adm.confirm !== 'c' + id) { adm.confirm = 'c' + id; render(); break; }
        adm.confirm = null; el.disabled = true; el.textContent = 'Attendi…'; toast('Sto preparando le credenziali…');
        tcall('nuoveCredenziali', id).then(r => {
          adm.cred = { user: r.user, password: r.password, messaggio: r.messaggio, whatsapp: r.whatsapp, titolo: 'Nuove credenziali pronte' };
          render(); window.scrollTo({ top: 0 });
          return tcall('elencoUtenze').then(l => { adm.users = l; render(); });
        }).catch(e => { toast(e.message); render(); });
        break;
      }
      case 'ustato': {
        const id = el.dataset.id, u = (adm.users || []).filter(x => x.id === id)[0]; if (!u) break;
        el.disabled = true;
        tcall('cambiaStato', id, u.stato !== 'attivo').then(() => tcall('elencoUtenze')).then(l => { adm.users = l; }).catch(e => toast(e.message)).then(render);
        break;
      }
    }
  });
  function go_noguard(h) { leaveArmed = true; go(h); }
  app.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.act === 'mark') {
      const d = el.dataset, v = el.checked;
      markDone(d.ch, d.t, +d.i, v); updateProgress();
      tcall('segnaCompletato', SEZ.id, d.ch, d.t, +d.i, v).then(() => { if (v) { const cc = DATA.capitoli.filter(x => x.id === d.ch)[0]; if (cc) inviaTest(cc, d.t); } }).catch(e => { markDone(d.ch, d.t, +d.i, !v); el.checked = !v; updateProgress(); toast(e.message); });
    } else if (el.dataset.ed && (el.tagName === 'SELECT' || el.type === 'number')) onEdit(el);
    else if (el.dataset.mat === 'gid') { MAT.gid = el.value; loadMat(''); }
    else if (el.dataset.act === 'mat-up') upMat(el);
    else if (el.dataset.adm) { adm[el.dataset.adm] = el.value; render(); }
    else if (el.dataset.pg) { pg[el.dataset.pg] = el.value; render(); }
    else if (el.form && el.form.dataset.form === 'nuova' && (el.name === 'ruolo' || el.name === 'indiv')) { readNew(el.form); render(); }
  });
  function readNew(form) {
    const f = adm.f; ['nome', 'utente', 'telefono', 'ruolo'].forEach(n => { if (form.elements[n]) f[n] = form.elements[n].value; });
    f.sezioni = readChecks(form, 'sezioni'); f.gruppi = readChecks(form, 'gruppi');
    f.indiv = !!(form.elements.indiv && form.elements.indiv.checked);
    f.accessibile = !!(form.elements.accessibile && form.elements.accessibile.checked);
    if (form.elements.strumento) f.strumento = form.elements.strumento.value;
    f.indDoc = readChecks(form, 'indDoc');
  }
  app.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset.act === 'note') { notes[el.dataset.k] = el.value; saveNotes(); }
    else if (el.dataset.ed && el.tagName !== 'SELECT' && el.type !== 'number') onEdit(el);
    else if (el.dataset.adm === 'q') { adm.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-adm="q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }
    else if (el.form && el.form.dataset.form === 'nuova') {
      if (el.name === 'nome' && !adm.uTouched) { const u = el.form.elements.utente; u.value = slug(el.value); }
      if (el.name === 'utente') adm.uTouched = true;
      readNew(el.form);
    }
  });
  function updateProgress() {
    const ch = DATA.capitoli[route.i]; if (!ch || route.v !== 'cap') return;
    const st = chapterStats(ch);
    const b = $('.ch-prog'); if (b) b.innerHTML = bar(st.done, st.total) + '<span>' + st.done + ' di ' + st.total + ' esercizi completati</span>';
  }
  app.addEventListener('submit', ev => {
    ev.preventDefault();
    const form = ev.target, kind = form.dataset.form, fe = form.elements;
    if (kind === 'login') {
      if (login.busy) return;
      const utente = fe.utente.value.trim(), password = fe.password.value;
      login.utente = utente; login.msg = ''; login.busy = true; render();
      api('login', utente, password).then(r => {
        SESS = { token: r.token, user: r.utente }; lastPwd = password;
        try { localStorage.setItem(KEY_S, r.token); } catch (e) { }
        login.busy = false; login.msg = '';
        if (SESS.user.cambio) { pw = { msg: '', busy: false }; render(); } else startCourse();
      }).catch(e => { login.busy = false; login.msg = e.message; render(); });
    } else if (kind === 'password') {
      if (pw.busy) return;
      const vecchia = lastPwd || fe.vecchia.value, nuova = fe.nuova.value;
      if (nuova !== fe.ripeti.value) { pw.msg = 'Le due password non coincidono.'; render(); return; }
      pw.busy = true; pw.msg = ''; render();
      tcall('cambiaPassword', vecchia, nuova).then(r => {
        SESS = { token: r.token, user: r.utente };
        try { localStorage.setItem(KEY_S, r.token); } catch (e) { }
        lastPwd = ''; pwOpen = false; pw = { msg: '', busy: false };
        if (DATA || PORTAL) { render(); toast('Password cambiata.'); } else startCourse();
      }).catch(e => { pw.busy = false; pw.msg = e.message; if (SESS) render(); });
    } else if (kind === 'nuova') {
      if (adm.formBusy) return;
      readNew(form);
      adm.formBusy = true; adm.formErr = ''; render();
      tcall('nuovaUtenza', Object.assign({}, adm.f, { individuale: adm.f.indiv && adm.f.ruolo === 'allievo' ? { strumento: adm.f.strumento, docenti: adm.f.indDoc } : null })).then(r => {
        if (r.avviso) toast(r.avviso); else if (r.gruppoIndividuale) toast('Creata la cartella individuale «' + r.gruppoIndividuale + '».');
        adm.cred = { user: r.user, password: r.password, messaggio: r.messaggio, whatsapp: r.whatsapp, titolo: 'Credenziali pronte' };
        adm.f = { nome: '', utente: '', telefono: '', ruolo: adm.f.ruolo, sezioni: [], gruppi: [], indiv: false, strumento: '', indDoc: [], accessibile: false }; adm.uTouched = false;
        return refreshSeg();
      }).catch(e => { adm.formErr = e.message; }).then(() => { adm.formBusy = false; render(); if (adm.cred) window.scrollTo({ top: 0 }); });
    } else if (kind === 'indiv') {
      const id = form.dataset.id;
      tcall('creaCartellaIndividuale', id, fe.strumento ? fe.strumento.value : '', readChecks(form, 'indDoc'))
        .then(r => refreshSeg().then(() => { adm.indId = null; toast('Creata la cartella individuale «' + r.nome + '».'); })).catch(e => toast(e.message)).then(render);
    } else if (kind === 'uedit') {
      const id = form.dataset.id;
      tcall('modificaUtenza', id, { nome: fe.nome.value, telefono: fe.telefono.value, sezioni: readChecks(form, 'sezioni'), gruppi: readChecks(form, 'gruppi'), accessibile: !!(fe.accessibile && fe.accessibile.checked) })
        .then(() => refreshSeg()).then(() => { adm.editId = null; toast('Dati salvati.'); }).catch(e => toast(e.message)).then(render);
    } else if (kind === 'assegna') {
      const id = form.dataset.id, u = (adm.users || []).filter(x => x.id === id)[0]; if (!u) return;
      tcall('modificaUtenza', id, { nome: u.nome, telefono: u.telefono, sezioni: readChecks(form, 'sezioni'), gruppi: readChecks(form, 'gruppi') })
        .then(() => refreshSeg()).then(() => toast('Assegnazioni salvate per ' + u.nome + '.')).catch(e => toast(e.message)).then(render);
    } else if (kind === 'gruppo') {
      adm.gMsg = '';
      tcall('salvaGruppo', form.dataset.id || '', fe.nome.value, '', fe.area ? fe.area.value : null).then(() => refreshSeg()).then(() => { adm.gEdit = null; adm.gBad = false; adm.gMsg = form.dataset.id ? 'Gruppo aggiornato.' : 'Gruppo aggiunto: la cartella è stata creata su Google Drive.'; })
        .catch(e => { adm.gBad = true; adm.gMsg = e.message; }).then(render);
    } else if (kind === 'collega') {
      adm.gMsg = '';
      tcall('salvaGruppo', form.dataset.id, form.dataset.nome, fe.link.value, null).then(() => refreshSeg()).then(() => { adm.gBad = false; adm.gMsg = 'Cartella collegata.'; })
        .catch(e => { adm.gBad = true; adm.gMsg = e.message; }).then(render);
    } else if (kind === 'cartella') {
      tcall('nuovaCartellaMateriali', MAT.gid, MAT.cart.cartella.id, fe.nome.value).then(() => { MAT.msg = 'Cartella creata.'; loadMat(MAT.cart.cartella.id); }).catch(e => toast(e.message));
    } else if (kind === 'modello') {
      adm.setMsg = ''; adm.setMsgBad = false;
      tcall('salvaModelloMessaggio', fe.modello.value, fe.link.value.trim()).then(() => { adm.set.modello = fe.modello.value; adm.set.link = fe.link.value.trim(); adm.setMsg = 'Messaggio salvato.'; })
        .catch(e => { adm.setMsg = e.message; adm.setMsgBad = true; }).then(render);
    }
  });

  /* ---------- avvio ---------- */
  function startCourse() {
    DATA = null; SEZ = null; PORTAL = null; MAT = null; adm = null; pg = null; editing = false; dirty = false;
    route = { v: 'portal', i: 0, tab: 'teoria' };
    loadPortal();
  }
  function accessoDaLink() {
    let h = ''; try { h = location.hash || ''; } catch (e) { }
    const m = /^#acc=([\w-]+)/.exec(h); if (!m) return null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
    try {
      let b = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
      const a = JSON.parse(decodeURIComponent(escape(atob(b))));
      return (a && a[0] && a[1]) ? { u: String(a[0]), p: String(a[1]) } : null;
    } catch (e) { return null; }
  }
  function boot() {
    const acc = accessoDaLink();
    if (acc) {
      try { localStorage.removeItem(KEY_S); } catch (e) { }
      login.utente = acc.u; login.busy = true;
      app.innerHTML = '<div class="loading">Domus Form Academy</div>';
      api('login', acc.u, acc.p).then(r => {
        SESS = { token: r.token, user: r.utente }; lastPwd = acc.p;
        try { localStorage.setItem(KEY_S, r.token); } catch (e) { }
        login.busy = false; login.msg = '';
        if (SESS.user.cambio) { pw = { msg: '', busy: false }; render(); } else startCourse();
      }).catch(e => { login.busy = false; login.msg = 'Il link è già stato usato o non è più valido: accedi con nome utente e password.'; render(); });
      return;
    }
    let tok = null; try { tok = localStorage.getItem(KEY_S); } catch (e) { }
    if (!tok) { render(); api('ping').catch(() => { }); return; }
    app.innerHTML = '<div class="loading">Domus Form Academy</div>';
    api('ripristina', tok).then(r => {
      SESS = { token: tok, user: r.utente }; lastPwd = '';
      if (SESS.user.cambio) { pw = { msg: '', busy: false }; render(); } else startCourse();
    }).catch(() => { try { localStorage.removeItem(KEY_S); } catch (e) { } render(); });
  }
  window.addEventListener('hashchange', () => { if (/^#acc=/.test(location.hash)) location.reload(); });
  boot();
})();

</script>
</body>
